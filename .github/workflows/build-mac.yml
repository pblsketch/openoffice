name: macOS arm64

# Unsigned Apple Silicon disk image for internal use. Not part of the PR test
# gate and not notarized. Download IeumOffice-mac-arm64 from the run's artifacts.
# First open on a Mac is right-click > Open, or `xattr -cr` on the copied app.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      # Do not pick a keychain identity. electron-builder.cjs then sets
      # identity null, skips notarization, and leaves the dmg unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-mac-

      - name: Install dependencies
        run: npm ci

      # notices, aarch64-apple-darwin sidecar, app builds (rhwp is fetched
      # while the HWP editor builds), then an unsigned arm64 dmg.
      - name: Package unsigned arm64 dmg
        run: npm run dist:mac -- -- --publish never

      - name: Upload dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: IeumOffice-mac-arm64
          path: apps/shell/release/*.dmg
          if-no-files-found: error
          retention-days: 14
