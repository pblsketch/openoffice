name: Linux build

# Builds the Linux packages (x64 AppImage, deb and rpm) on a GitHub-hosted
# Ubuntu runner (docs/releasing.ko.md, "Linux 설치 파일"). No repository secret
# is involved.
#
# Run from the Actions tab on main. With a release tag (v0.12.1), the build
# is also attached to that existing GitHub release, but only from main and
# only when the built version is the tag's; without one it stays an artifact.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to attach the Linux files to (e.g. v0.12.1); empty = artifact only'
        required: false
        default: ''
  # a change to the Linux packaging is proved on a real Linux runner before it merges
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/linux-build.yml
      - apps/shell/electron-builder.cjs
      - apps/shell/build/**

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # 22.04 matches the e2e runner and keeps glibc requirements broad across
    # desktop distributions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-linux-${{ runner.arch }}-

      # electron-builder needs rpmbuild on the host to build the .rpm target
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Install dependencies
        run: npm ci

      # build:all builds the sheets module, which builds the xlsx sidecar for
      # this host (target/release/xlsx-sidecar, where the Linux config reads it)
      - name: Build apps
        run: npm run build:all
        # the Google Drive client (decisions 0033, 0085) goes into the shell build;
        # without it the build ships without Drive
        env:
          GENOFFICE_GOOGLE_CLIENT_ID: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_ID }}
          GENOFFICE_GOOGLE_CLIENT_SECRET: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_SECRET }}

      - name: Package
        run: npm run dist:linux -w @genoffice/shell -- --publish never
        env:
          GENOFFICE_GOOGLE_CLIENT_ID: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_ID }}
          GENOFFICE_GOOGLE_CLIENT_SECRET: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_SECRET }}

      # a release build should carry the Drive client; say so when it does not
      - name: The Google Drive client is in the build
        env:
          HAS_CLIENT: ${{ secrets.GENOFFICE_GOOGLE_CLIENT_ID != '' }}
        run: |
          if [ "$HAS_CLIENT" != "true" ]; then
            echo "::warning::GENOFFICE_GOOGLE_CLIENT_ID is not set; this build ships without Google Drive"
            exit 0
          fi
          grep -rqs "apps.googleusercontent.com" apps/shell/out/main || {
            echo "::error::the Google Drive client did not reach the shell build"
            exit 1
          }

      - name: Check the bundled programs and packages
        run: |
          set -euo pipefail
          dir="apps/shell/release/linux-unpacked"
          for bin in \
            "$dir/ieumoffice" \
            "$dir/resources/native/xlsx-sidecar" \
            "$dir/resources/cli/ieumoffice"; do
            test -x "$bin" || { echo "missing or not executable: $bin"; exit 1; }
          done
          compgen -G "apps/shell/release/IeumOffice-*.AppImage" >/dev/null
          compgen -G "apps/shell/release/ieumoffice_*_amd64.deb" >/dev/null
          compgen -G "apps/shell/release/ieumoffice-*.x86_64.rpm" >/dev/null
          test -f "apps/shell/release/latest-linux.yml"
          # Ubuntu 24.04 renamed part of electron-builder's default deb
          # dependencies in the 64-bit time_t transition, so the control file
          # must carry "plain | t64" alternatives (electron-builder.cjs
          # deb.depends); an rpm/dnf install carries no such renames.
          depends="$(dpkg-deb -f apps/shell/release/ieumoffice_*_amd64.deb Depends)"
          for name in libgtk-3-0 libnotify4 libxtst6 libatspi2.0-0 libsecret-1-0; do
            grep -Eq "$name[[:space:]]*\|[[:space:]]*$name"t64 <<<"$depends" || {
              echo "deb Depends is missing the t64 alternative for $name: $depends"
              exit 1
            }
          done

      # The packages are consumed on distributions newer than this 22.04
      # runner. Prove in a container that the deb's dependency set — the
      # "plain | t64" alternatives of electron-builder.cjs deb.depends — is
      # still resolvable on Ubuntu 24.04 before the file is uploaded.
      - name: The deb resolves its dependencies on Ubuntu 24.04
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/apps/shell/release:/pkg:ro" ubuntu:24.04 \
            bash -c 'set -o pipefail; apt-get update -qq && apt-get -s install /pkg/ieumoffice_*_amd64.deb | tail -n 5'

      # Newer Ubuntu kernels ship an AppArmor policy that blocks unprivileged
      # user namespaces, which kills the Chromium zygote even with --no-sandbox
      - name: Allow unprivileged user namespaces (Electron)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not present — skipping"
          fi

      # The packaged app itself, run without a window under Xvfb: a Markdown and
      # a CSV file (the latter through the xlsx sidecar) are exported to PDF
      - name: Smoke test the packaged app
        run: |
          set -euo pipefail
          exe="apps/shell/release/linux-unpacked/ieumoffice"
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          printf '# Smoke test\n\nHello from the Linux build.\n' > "$work/note.md"
          printf 'name,count\napple,3\npear,5\n' > "$work/table.csv"
          for input in note.md table.csv; do
            xvfb-run --auto-servernum -- "$exe" --headless-export "$work/$input" --to pdf --out "$work/$input.pdf" --json --no-sandbox
            test -s "$work/$input.pdf"
          done

      # Sandboxes that hand the command line to an agent often cap virtual
      # memory (ulimit -v) far below what a WebAssembly memory reserves. Document
      # commands must still run there, the ones that need the parser must answer
      # resource_limit instead of aborting, and capabilities must say which is
      # which before an agent plans work.
      - name: The command line runs under a 2 GB virtual-memory cap
        run: |
          set -euo pipefail
          cli="$PWD/apps/shell/release/linux-unpacked/resources/cli/genoffice.cjs"
          work="$RUNNER_TEMP/cli-cap"
          mkdir -p "$work"
          printf '# Cap\n\n- one\n- two\n' > "$work/note.md"
          limited() { bash -c 'ulimit -v 2097152; exec "$@"' _ "$@"; }
          limited node "$cli" --version
          limited node "$cli" create --type docx --from "$work/note.md" --out "$work/note.docx" --json
          limited node "$cli" docs read "$work/note.docx" --json
          limited node "$cli" capabilities --json > "$work/cap.json"
          grep -q '"wasm":{"available":false' "$work/cap.json" || {
            echo "capabilities should report wasm as unavailable under the cap"; cat "$work/cap.json"; exit 1;
          }
          set +e
          limited node "$cli" pdf read "$RUNNER_TEMP/smoke/note.md.pdf" --json > "$work/pdf.json" 2>/dev/null
          code=$?
          set -e
          [ "$code" -eq 3 ] || { echo "pdf read should answer 3 under the cap, got $code"; cat "$work/pdf.json"; exit 1; }
          grep -q '"error":"resource_limit"' "$work/pdf.json" || {
            echo "pdf read should answer resource_limit under the cap"; cat "$work/pdf.json"; exit 1;
          }

      # The same command line without the Electron runtime: a tarball an agent
      # sandbox or server can unpack. Proved in a bare Node image (no GTK, no
      # app) under the 2 GB virtual-memory cap such containers usually have.
      - name: Build the standalone command-line archive
        run: |
          set -euo pipefail
          node packages/cli/pack-tarball.mjs \
            --from apps/shell/release/linux-unpacked/resources \
            --out apps/shell/release --platform linux --arch x64
          cat apps/shell/release/ieumoffice-cli_*.tar.gz.sha256

      - name: The standalone archive runs without GTK or the app
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/apps/shell/release:/dist:ro" \
            -v "$RUNNER_TEMP/smoke:/work:ro" \
            node:22-slim bash -c '
              set -euo pipefail
              ulimit -v 2097152
              mkdir -p /tmp/cli
              tar -xzf /dist/ieumoffice-cli_*.tar.gz -C /tmp/cli
              cli=/tmp/cli/ieumoffice-cli/cli/ieumoffice
              "$cli" --version
              printf "# Standalone\n\n- one\n- two\n" > /tmp/note.md
              "$cli" create --type docx --from /tmp/note.md --out /tmp/note.docx --json
              "$cli" docs read /tmp/note.docx --json
              "$cli" capabilities --json > /tmp/cap.json
              grep -q "\"wasm\":{\"available\":false" /tmp/cap.json
              set +e
              "$cli" pdf read /work/note.md.pdf --json > /tmp/pdf.json 2>/dev/null
              code=$?
              set -e
              [ "$code" -eq 3 ]
              grep -q "\"error\":\"resource_limit\"" /tmp/pdf.json
            '

      - name: List the release files
        run: ls -la apps/shell/release

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ieumoffice-linux-x64
          path: |
            apps/shell/release/*.AppImage
            apps/shell/release/*.deb
            apps/shell/release/*.rpm
            apps/shell/release/*cli*.tar.gz
            apps/shell/release/*cli*.tar.gz.sha256
            apps/shell/release/*-linux.yml
          if-no-files-found: error
          retention-days: 14

  attach:
    # the one job that writes: it adds the build to a release the maintainer
    # already published, and only for a run started by hand on main
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Attach to the release
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name ieumoffice-linux-x64 --dir linux
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
          gh release view "$TAG" >/dev/null || { echo "no release $TAG: publish it first"; exit 1; }
          feed=$(ls linux/*-linux.yml)
          built=$(sed -n 's/^version: *//p' $feed | tr -d "'\"")
          [ "v$built" = "$TAG" ] || { echo "built $built, but the release is $TAG"; exit 1; }
          gh release upload "$TAG" linux/*.AppImage linux/*.deb linux/*.rpm linux/*cli*.tar.gz linux/*cli*.tar.gz.sha256 $feed --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
